spring.application.name=EventSphere
spring.profiles.active=dev
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Mail configuration defaults
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8

# Application mail properties
app.mail.from=${MAIL_FROM:${spring.mail.username:noreply@eventsphere.com}}
app.mail.from-name=${MAIL_FROM_NAME:EventSphere}
app.documents.max-size-bytes=${DOCUMENT_MAX_SIZE_BYTES:10485760}
spring.servlet.multipart.max-file-size=${DOCUMENT_MAX_SIZE:10MB}
spring.servlet.multipart.max-request-size=${DOCUMENT_MAX_REQUEST_SIZE:30MB}
